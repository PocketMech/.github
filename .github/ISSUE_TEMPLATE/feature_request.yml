name: Feature request
description: Propose an improvement or new capability
title: "[feature]: "
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and the outcome you hope for.
        Keep requests factual and scoped to PocketMech / AeroTool.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the stack would this primarily affect?
      options:
        - mobile
        - core
        - sync
        - admin
        - api
        - .github / org
        - unknown / cross-cutting
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature address?
      placeholder: As a … I need … because …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from a user or developer perspective?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related docs, ADRs, or constraints.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This request does not invent product facts, metrics, or unsupported claims
          required: true
